version: 2

builds:
  - id: gatereach
    main: ./cmd/gatereach
    binary: gatereach
    env:
      - CGO_ENABLED=0
    # 1. No path of the build machine lands in the binary
    # 2. The binary's file time comes from the commit instead of the build
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    # The only source of the version
    # so the code holds no number that could drift from the tag
    ldflags:
      - -s -w -X github.com/jeon-jihyeon/gatereach/internal/version.Version={{ .Version }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

# bin/gatereach downloads gatereach_{os}_{arch}.tar.gz and checksums.txt from the release tagged v<plugin.json version>
# The v* tag must equal the version in .claude-plugin/plugin.json
archives:
  - id: gatereach
    ids: [gatereach]
    formats: [tar.gz]
    name_template: "gatereach_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE

checksum:
  name_template: checksums.txt

# The release workflow checks the version, attests the archives and then publishes the draft
release:
  draft: true
