name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # Write access stays on the one job that publishes
    permissions:
      contents: write
      # Signs the build provenance through the GitHub OIDC token
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The tag must equal the plugin version, because bin/gatereach fetches the release of that version
      - name: Tag matches plugin.json
        run: test "v$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .claude-plugin/plugin.json | head -n 1)" = "$GITHUB_REF_NAME"
      # Publishes a draft so the release appears only once every archive is uploaded and attested
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The launcher compares this with the plugin version, so a binary that answers another one never ships
      - name: Binary version matches the tag
        run: test "v$(dist/gatereach_linux_amd64_v1/gatereach --version)" = "$GITHUB_REF_NAME"
      # `gh attestation verify <archive> --repo jeon-jihyeon/gatereach` checks an archive was built here from the tag
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
      - name: Publish the release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
